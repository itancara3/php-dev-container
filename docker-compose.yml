name: clases-php

services:
  php:
    build:
      context: ./.devcontainer
    volumes:
      - ./php:/workspace
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
      - "127.0.0.1:${VITE_PORT:-5173}:5173"
      - "127.0.0.1:${PHP_PORT:-7001}:7001"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clases}
      POSTGRES_USER: ${POSTGRES_USER:-clases}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clases}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
